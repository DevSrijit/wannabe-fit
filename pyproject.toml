[project]
name = "vitals"
version = "0.1.0"
description = "Whoop-style recovery, strain, and sleep metrics from any Android Health Connect export. Local only, no cloud, no AI inference."
readme = "README.md"
license = "MIT"
authors = [{ name = "Srijit Ghosh" }]
requires-python = ">=3.12"
keywords = ["health-connect", "wearable", "heart-rate", "whoop", "trimp", "mcp", "sqlite"]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "mcp>=1.2",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/devsrijit/wannabe-fit"

[project.scripts]
vitals = "vitals.cli:main"
vitals-mcp = "vitals.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitals"]
